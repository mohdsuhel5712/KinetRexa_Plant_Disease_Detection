<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>
            Plant Disease Detection
      </title>
      <style>
            * {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
            }
            body {
                  min-height: 100vh;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  font-family: Arial, sans-serif;
                  background:
                        linear-gradient(135deg,
                              #d4fc79,
                              #96e6a1);
                  padding: 25px;
            }
            .container {
                  width: 100%;
                  max-width: 700px;
                  background: white;
                  padding: 40px;
                  border-radius: 20px;
                  box-shadow:
                        0 15px 40px rgba(0,
                              0,
                              0,
                              0.2);
                  text-align: center;
            }
            h1 {
                  color: #1f6b3b;
                  margin-bottom: 10px;
            }
            .description {
                  color: #555;
                  margin-bottom: 30px;
            }
            form {
                  display: flex;
                  flex-direction: column;
                  gap: 20px;
            }
            input[type="file"] {
                  width: 100%;
                  padding: 15px;
                  border:
                        2px dashed #3c9d5d;
                  border-radius: 10px;
                  cursor: pointer;
            }
            button {
                  border: none;
                  padding: 15px;
                  border-radius: 10px;
                  background: #287a45;
                  color: white;
                  font-size: 17px;
                  font-weight: bold;
                  cursor: pointer;
            }
            button:hover {
                  background: #1c5d33;
            }
            .error {
                  margin-top: 25px;
                  padding: 15px;
                  color: #a10000;
                  background: #ffdada;
                  border-radius: 10px;
            }
            .result {
                  margin-top: 30px;
                  padding: 25px;
                  background: #edf9f0;
                  border-radius: 15px;
            }
            .result h2 {
                  color: #216c3b;
                  margin-bottom: 15px;
            }
            .result p {
                  margin: 10px;
                  font-size: 18px;
            }
            .uploaded-image {
                  width: 100%;
                  max-width: 400px;
                  max-height: 350px;
                  object-fit: contain;
                  margin-top: 20px;
                  border-radius: 12px;
                  border:
                        3px solid #4b9b63;
            }
      </style>
</head>
<body>
      <div class="container">
            <h1>
                  🌿 Plant Disease Detection
            </h1>
            <p class="description">
                  Upload a leaf image and detect
                  the plant disease using CNN.
            </p>
            <form action="/predict" method="POST" enctype="multipart/form-data">
                  <input type="file" name="leaf_image" accept="image/*" required>
                  <button type="submit">
                        Detect Disease
                  </button>
            </form>

            {% if error %}
            <div class="error">
                  {{ error }}
            </div>
            {% endif %}


            {% if prediction %}

            <div class="result">
                  <h2>
                        Prediction Result
                  </h2>
                  <p>
                        <strong>
                              Disease:
                        </strong>
                        {{ prediction }}
                  </p>
                  <p>
                        <strong>
                              Confidence:
                        </strong>
                        {{ confidence }}%
                  </p>
                  <img class="uploaded-image" src="{{ url_for(
                    'static',
                    filename=image_url
                ) }}" alt="Uploaded Leaf">
            </div>
            {% endif %}

            
      </div>
</body>
</html>
